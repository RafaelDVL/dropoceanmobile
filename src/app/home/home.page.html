<ion-header>
  <ion-toolbar>
      <ion-title>Doser DropOcean</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Texto alterna conforme o estado da conexão -->
  <h2 *ngIf="!isConnected; else connectedMsg">Conecte seu dispositivo dosador</h2>
  <ng-template #connectedMsg>
    <h2>Dispositivo conectado</h2>
  </ng-template>

  <!-- Botão para conectar aparece apenas se não estiver conectado -->
  <ion-button expand="block"(click)="connectToESP32()" *ngIf="!isConnected" color="tertiary">
    🔗 Procurar e Conectar
  </ion-button>

  <!-- Botão para ir para configuração aparece apenas após a conexão -->
  <ion-button expand="block" (click)="onClick()" *ngIf="isConnected" color="tertiary">Ir para configuração</ion-button>

  <ion-button expand="block" fill="outline" color="tertiary" style="width: 50%;" shape="round" routerLink="/log"><ion-icon name="receipt" slot="start"></ion-icon>Log de Acionamentos</ion-button>
</ion-content> 

<div>
	@if (showSucess) {
		<ngb-toast 
			[autohide]="true"
			(hidden)="showSucess = false"
			[ngClass]="'bg-success text-light full-width-toast'"
		>
			Dispositivo conectado com sucesso.
		</ngb-toast>
	}
</div>
<div>
	@if (showError) {
		<ngb-toast 
			[autohide]="true"
			(hidden)="showError = false"
			[ngClass]="'bg-danger text-light full-width-toast'"
		>
			Erro ao conectar dispositivo.
		</ngb-toast>
	}
</div>
